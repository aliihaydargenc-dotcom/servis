) + 16px);gap:8px}.mapControls button{width:44px;height:44px}.zoomGroup{display:none}.notice{left:50%;bottom:auto;top:calc(236px + env(safe-area-inset-top));width:max-content;max-width:calc(100% - 28px);font-size:13px}.leaflet-bottom{bottom:calc(min(310px,44dvh) + 3px)}.sheet.open~*{pointer-events:none}}

<body>
<div id="map" role="region" aria-label="Yakındaki yerlerin haritası"></div>
<aside class="sidebar" aria-label="Yer keşfi">
 <header class="top">
  <div class="brand"><span class="brandIcon" data-icon="radar"></span><div><h1>Konum Radar</h1><small>Çevreni keşfet</small></div><span class="weather" id="weather"></span></div>
  <form class="search" id="searchForm" role="search"><span data-icon="search"></span><input id="searchInput" type="search" aria-label="Yer veya şehir ara" placeholder="Yer veya şehir ara" autocomplete="off"><button type="button" id="clearBtn" aria-label="Aramayı temizle" hidden data-icon="close"></button><button type="submit" aria-label="Ara" data-icon="arrow"></button></form>
  <p class="searchHint">Bir şehir ara veya haritadan bölge seç.</p>
 </header>
 <nav class="chips" id="chips" aria-label="Yer kategorileri"></nav>
 <section class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="handleArea" aria-hidden="true"><div class="handle"></div></div>
  <div class="sheetHead"><div class="titleWrap"><h2 id="sheetTitle">Nereden başlayalım?</h2><p id="sheetSub">Konumunla veya seçtiğin bir bölgeyle.</p></div><button class="expand" id="expand" aria-label="Sonuçları genişlet" aria-expanded="false" aria-controls="results" data-icon="up"></button></div>
  <div class="rangeBar" id="rangeBar" hidden><span id="quick"></span><label><span class="sr-only" hidden>Arama yarıçapı</span><select id="radius" aria-label="Arama yarıçapı"><option value="1000">1 km çevre</option><option value="3000">3 km çevre</option><option value="5000">5 km çevre</option></select></label></div>
  <div class="results" id="results" aria-live="polite"></div>
  <footer class="foot">Yer bilgileri: OpenStreetMap topluluğu.<br>Mesafeler kuş uçuşudur; bilgiler eksik olabilir.</footer>
 </section>
</aside>
<div class="mapTop"><div class="locationPill"><span data-icon="pin"></span><span id="locationLabel">Bir bölge seç</span></div><button class="areaBtn" id="areaBtn" data-ready="false"><span data-icon="search"></span>Bu bölgede ara</button></div>
<div class="mapControls"><button id="locateBtn" aria-label="Konumumu bul" title="Konumumu bul" data-icon="locate"></button><div class="zoomGroup"><button id="zoomIn" aria-label="Haritayı yakınlaştır" data-icon="plus"></button><button id="zoomOut" aria-label="Haritayı uzaklaştır" data-icon="minus"></button></div></div>
<div class="notice" id="notice" role="status" hidden></div><div id="status" data-ready="false" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(()=>{'use strict';
const paths={radar:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="m12 12 7-7"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',pin:'<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/>',locate:'<circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/>',up:'<path d="m6 15 6-6 6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',cafe:'<path d="M4 8h12v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4Zm12 1h2a3 3 0 1 1 0 6h-2M7 3v2m5-2v2"/>',restaurant:'<path d="M5 3v6m3-6v6m3-6v6M5 7h6M8 9v12M19 3c-4 3-4 9 0 9V3Zm0 9v9"/>',supermarket:'<path d="M3 4h2l3 12h11l2-9H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>',pharmacy:'<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6Z"/>',hospital:'<path d="M5 21V5h14v16M9 21v-5h6v5M12 7v6m-3-3h6"/>',park:'<path d="m12 3-6 8h3l-5 6h7v4h2v-4h7l-5-6h3Z"/>',hotel:'<path d="M3 21V5m18 16V9H3m0 8h18M7 9V6h5v3"/>',route:'<path d="m7 17 10-10M7 7h10v10"/>',other:'<circle cx="12" cy="12" r="7"/>',atm:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18m-5 5h2"/>'};
const icon=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(paths[n]||paths.other)+'</svg>';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
$$('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const names={nearby:'Yakınımda',cafe:'Kafe',restaurant:'Yemek',supermarket:'Market',pharmacy:'Eczane',hospital:'Sağlık',park:'Park',hotel:'Otel',atm:'ATM',other:'Yer'};
$('#chips').innerHTML=Object.entries(names).filter(([k])=>!['atm','other'].includes(k)).map(([k,v])=>'<button class="chip'+(k==='nearby'?' active':'')+'" data-cat="'+k+'" aria-pressed="'+(k==='nearby')+'">'+icon(k==='nearby'?'radar':k)+v+'</button>').join('');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={center:null,user:null,items:[],cat:'nearby',query:'',selected:null,loading:false,error:'',mode:'nearby',searchResults:[],areaName:'',radius:1000};
let map,layer,clusterGroup,userMarker,centerMarker,markers=[],timer,loadController,searchController,loadId=0,searchId=0;
function flash(message){clearTimeout(timer);$('#notice').textContent=message;$('#notice').hidden=false;timer=setTimeout(()=>$('#notice').hidden=true,4500)}
function setSheet(open){$('#sheet').classList.toggle('open',open);$('#expand').innerHTML=icon(open?'down':'up');$('#expand').setAttribute('aria-expanded',String(open));$('#expand').setAttribute('aria-label',open?'Sonuçları küçült':'Sonuçları genişlet')}
function distance(a,b){const r=Math.PI/180,dlat=(b.lat-a.lat)*r,dlon=(b.lon-a.lon)*r,x=Math.sin(dlat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dlon/2)**2;return 6371000*2*Math.asin(Math.min(1,Math.sqrt(x)))}
const fmt=m=>m<1000?Math.round(m)+' m':(m/1000).toLocaleString('tr-TR',{maximumFractionDigits:1})+' km';
function category(t){if(t.amenity==='cafe')return'cafe';if(['restaurant','fast_food'].includes(t.amenity))return'restaurant';if(['supermarket','convenience'].includes(t.shop))return'supermarket';if(t.amenity==='pharmacy')return'pharmacy';if(['hospital','clinic'].includes(t.amenity))return'hospital';if(t.amenity==='atm')return'atm';if(t.leisure==='park')return'park';if(['hotel','hostel'].includes(t.tourism))return'hotel';return'other'}
function current(){if(state.mode==='search')return state.searchResults;let a=state.items.filter(x=>state.cat==='nearby'||x.cat===state.cat);if(state.query){const s=state.query.toLocaleLowerCase('tr');a=a.filter(x=>(x.name+' '+names[x.cat]).toLocaleLowerCase('tr').includes(s))}return a.slice(0,30)}
function route(x){return 'https://www.google.com/maps/dir/?api=1&destination='+x.lat+','+x.lon}
function renderMarkers(){if(!map)return;if(clusterGroup)clusterGroup.clearLayers();else markers.forEach(m=>m.remove());markers=[];current().forEach((x,i)=>{const selected=state.selected===x.id;const m=L.marker([x.lat,x.lon],{title:x.name,icon:L.divIcon({className:'',html:'<div class="poi'+(selected?' selected':'')+'">'+(i+1)+'</div>',iconSize:[32,36],iconAnchor:[16,36]}),zIndexOffset:selected?500:0});if(clusterGroup)clusterGroup.addLayer(m);else m.addTo(map);m.bindPopup('<strong>'+esc(x.name)+'</strong><br>'+esc(x.address||names[x.cat])+'<a href="'+route(x)+'" target="_blank" rel="noopener noreferrer">Yol tarifi al ↗</a>');m.on('click',()=>{state.selected=x.id;$$('.place').forEach(el=>el.classList.toggle('selected',el.dataset.id===x.id));markers.forEach((p,j)=>p.setIcon(L.divIcon({className:'',html:'<div class="poi'+(j===i?' selected':'')+'">'+(j+1)+'</div>',iconSize:[32,36],iconAnchor:[16,36]})));if(state.mode==='search')flash('Bu yerin çevresi için “Bölgeyi seç” düğmesine dokun.');});markers.push(m)})}
function empty(title,text,action,label){return '<div class="empty"><div class="emptySymbol">'+icon('radar')+'</div><h3>'+title+'</h3><p>'+text+'</p>'+(action?'<button class="primary" data-action="'+action+'">'+icon(action==='locate'?'locate':'search')+label+'</button>':'')+'</div>'}
function render(){const a=current();$('#sheet').classList.toggle('hasResults',!!a.length&&!state.loading&&!state.error);$('#rangeBar').hidden=!state.center||state.mode==='search';$('#quick').textContent='Kuş uçuşu mesafe';$('#locationLabel').textContent=state.areaName||'Bir bölge seç';$('#clearBtn').hidden=!$('#searchInput').value;$('#results').setAttribute('aria-busy',String(state.loading));$('#status').dataset.ready=String(!state.loading&&!state.error&&!!state.center);$('#sheetTitle').textContent=state.mode==='search'?'Arama sonuçları':(state.center?(state.cat==='nearby'?'Yakındaki yerler':names[state.cat]):'Nereden başlayalım?');$('#sheetSub').textContent=state.mode==='search'?'Bir yerin çevresini keşfetmek için seç.':(state.center?(state.areaName+' · '+a.length+' yer'):'Konumunla veya seçtiğin bir bölgeyle.');
if(state.loading){$('#sheetSub').textContent=state.mode==='search'?'Arama sonuçları hazırlanıyor…':state.areaName+' · Yerler aranıyor…';$('#results').innerHTML='<div class="loadingText">'+(state.mode==='search'?'Yerler aranıyor…':'Yakındaki yerler yükleniyor…')+'</div><div class="skeleton"></div><div class="skeleton"></div>';return}
if(state.error){$('#results').innerHTML=empty('Şu an sonuç alınamadı',esc(state.error),'retry','Tekrar dene');return}
if(!state.center&&state.mode!=='search'){$('#results').innerHTML=empty('Çevrendeki yerleri keşfet','Konumunu kullan ya da yukarıdan bir şehir ara.','locate','Konumumu kullan');renderMarkers();return}
if(!a.length){$('#results').innerHTML=empty('Sonuç bulunamadı',state.query?'Farklı bir adla aramayı veya başka bir kategori seçmeyi dene.':'Bu bölgede kayıtlı bir yer bulunamadı. Arama mesafesini artırabilir veya haritadan başka bir bölge seçebilirsin.');renderMarkers();return}
$('#results').innerHTML=a.map((x,i)=>'<article class="place'+(state.selected===x.id?' selected':'')+'" data-id="'+esc(x.id)+'"><button class="placeMain" data-focus="'+i+'" aria-label="'+esc(x.name)+', haritada göster"><span class="catBadge">'+icon(x.cat)+'<small>'+(i+1)+'</small></span><span class="placeText"><h3>'+esc(x.name)+'</h3><span class="meta">'+esc(state.mode==='search'?(x.address||'Yer'):names[x.cat]+' · '+fmt(x.dist))+'</span></span></button>'+(state.mode==='search'?'<button class="routeBtn" data-area="'+i+'" aria-label="'+esc(x.name)+' bölgesini seç" title="Bölgeyi seç">'+icon('plus')+'</button>':'<a class="routeBtn" href="'+route(x)+'" target="_blank" rel="noopener noreferrer" aria-label="'+esc(x.name)+' için yol tarifi" title="Yol tarifi">'+icon('route')+'</a>')+'</article>').join('');renderMarkers()}
function query(){const {lat,lon}=state.center,r=state.radius;return '[out:json][timeout:20];('+['["amenity"~"^(cafe|restaurant|fast_food|pharmacy|hospital|clinic|atm)$"]','["shop"~"^(supermarket|convenience)$"]','["leisure"="park"]','["tourism"~"^(hotel|hostel)$"]'].map(x=>'nwr(around:'+r+','+lat+','+lon+')'+x+';').join('')+');out center tags;'}
async function load(){if(!state.center||!map)return;if(loadController)loadController.abort();const id=++loadId;const controller=loadController=new AbortController();state.mode='nearby';state.loading=true;state.error='';state.items=[];renderMarkers();render();let last;
for(const endpoint of ['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.maprva.org/api/interpreter']){if(controller.signal.aborted||id!==loadId)return;const attempt=new AbortController();const abort=()=>attempt.abort();controller.signal.addEventListener('abort',abort,{once:true});const timeout=setTimeout(abort,18000);try{const res=await fetch(endpoint,{method:'POST',body:new URLSearchParams({data:query()}),signal:attempt.signal});if(!res.ok)throw Error('HTTP '+res.status);const d=await res.json();if(d.remark||!Array.isArray(d.elements))throw Error('Incomplete response');if(id!==loadId||controller.signal.aborted)return;const seen=new Set();state.items=d.elements.map(el=>{const p=el.center||el,t=el.tags||{},c=category(t);if(!Number.isFinite(p.lat)||!Number.isFinite(p.lon))return null;const name=t.name||t.brand||names[c],key=name+'|'+p.lat.toFixed(4)+'|'+p.lon.toFixed(4);if(seen.has(key))return null;seen.add(key);return{id:el.type+'/'+el.id,name,cat:c,lat:p.lat,lon:p.lon,dist:distance(state.center,{lat:p.lat,lon:p.lon})}}).filter(Boolean).sort((a,b)=>a.dist-b.dist);state.loading=false;render();return}catch(e){last=e;if(controller.signal.aborted)return}finally{clearTimeout(timeout);controller.signal.removeEventListener('abort',abort)}}if(id===loadId){state.loading=false;state.error='Yer servisi yanıt vermedi. Bağlantını kontrol edip yeniden deneyebilirsin.';render()}}
function selectCenter(lat,lon,name){++searchId;if(searchController)searchController.abort();state.center={lat,lon};state.areaName=name;state.query='';state.selected=null;$('#searchInput').value='';if(centerMarker)centerMarker.remove();centerMarker=L.marker([lat,lon],{interactive:false,icon:L.divIcon({className:'',html:'<div class="centerDot"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);map.setView([lat,lon],15);setSheet(false);load()}
async function locate(){if(!map)return;if(!navigator.geolocation){flash('Bu tarayıcı konum özelliğini desteklemiyor. Şehir adıyla arayabilirsin.');return}$('#locateBtn').disabled=true;flash('Konumun bulunuyor…');navigator.geolocation.getCurrentPosition(p=>{$('#locateBtn').disabled=false;state.user={lat:p.coords.latitude,lon:p.coords.longitude};if(userMarker)userMarker.remove();selectCenter(state.user.lat,state.user.lon,'Konumunun çevresi');userMarker=L.marker([state.user.lat,state.user.lon],{title:'Konumun',icon:L.divIcon({className:'',html:'<div class="userDot"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map);flash('Konumun bulundu')},e=>{$('#locateBtn').disabled=false;flash(e.code===1?'Konum izni verilmedi. Şehir adıyla arayabilir veya haritadan bölge seçebilirsin.':e.code===3?'Konum alma süresi doldu. Tekrar deneyebilir veya şehir arayabilirsin.':'Konum belirlenemedi. Şehir adıyla arayabilirsin.')},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}
async function search(){const term=$('#searchInput').value.trim();if(!term){state.query='';state.mode='nearby';state.error='';render();return}if(term.length<2){flash('En az iki karakter yaz.');return}if(searchController)searchController.abort();if(loadController)loadController.abort();++loadId;const id=++searchId,controller=searchController=new AbortController();state.query=term;state.mode='search';state.loading=true;state.error='';state.searchResults=[];renderMarkers();render();setSheet(true);const timeout=setTimeout(()=>controller.abort(),15000);try{let url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&accept-language=tr&q='+encodeURIComponent(term);if(state.center){const p=state.center;url+='&viewbox='+[p.lon-.12,p.lat+.12,p.lon+.12,p.lat-.12].join(',')}const res=await fetch(url,{signal:controller.signal});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(id!==searchId)return;state.searchResults=data.map(x=>({id:'search/'+x.place_id,name:x.name||x.display_name.split(',')[0],address:x.display_name,cat:'other',lat:Number(x.lat),lon:Number(x.lon)}));state.loading=false;render();if(state.searchResults.length)map.fitBounds(state.searchResults.map(x=>[x.lat,x.lon]),{maxZoom:14,paddingTopLeft:[40,180],paddingBottomRight:[40,250]})}catch(e){if(id===searchId){state.loading=false;state.error='Arama servisine ulaşılamadı. Tekrar deneyebilir veya haritayı kaydırıp “Bu bölgede ara” düğmesini kullanabilirsin.';render()}}finally{clearTimeout(timeout)}}
$('#expand').addEventListener('click',()=>setSheet(!$('#sheet').classList.contains('open')));$('#locateBtn').addEventListener('click',locate);$('#searchForm').addEventListener('submit',e=>{e.preventDefault();$('#searchInput').blur();search()});$('#searchInput').addEventListener('input',()=>{$('#clearBtn').hidden=!$('#searchInput').value});$('#clearBtn').addEventListener('click',()=>{++searchId;if(searchController)searchController.abort();state.loading=false;state.error='';state.query='';state.mode='nearby';$('#searchInput').value='';render();$('#searchInput').focus()});$('#radius').addEventListener('change',()=>{state.radius=Number($('#radius').value);load()});$('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;++searchId;if(searchController)searchController.abort();state.cat=b.dataset.cat;state.mode='nearby';state.query='';state.error='';$('#searchInput').value='';$$('.chip').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});if(state.loading){if(loadController)loadController.abort();state.loading=false;if(state.center){load();return}}render();if(state.center)setSheet(true)});
$('#results').addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(action){if(action.dataset.action==='locate')locate();else if(action.dataset.action==='retry'){if(state.mode==='search')search();else load()}return}const focus=e.target.closest('[data-focus]'),area=e.target.closest('[data-area]');if(area){const x=current()[Number(area.dataset.area)];selectCenter(x.lat,x.lon,x.name);return}if(focus&&map){const i=Number(focus.dataset.focus),x=current()[i];state.selected=x.id;render();setSheet(false);map.setView([x.lat,x.lon],17);if(clusterGroup)clusterGroup.zoomToShowLayer(markers[i],()=>markers[i].openPopup());else markers[i]?.openPopup()}});
let startY=null;$('.handleArea').addEventListener('pointerdown',e=>{startY=e.clientY;e.currentTarget.setPointerCapture(e.pointerId)});$('.handleArea').addEventListener('pointerup',e=>{if(startY!==null){const dy=e.clientY-startY;if(Math.abs(dy)>12)setSheet(dy<0);else setSheet(!$('#sheet').classList.contains('open'));startY=null}});
if(typeof L==='undefined'){state.error='Harita yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.';render();$('#results').innerHTML=empty('Harita yüklenemedi',state.error);$('#areaBtn').disabled=true;$('#locateBtn').disabled=true;return}
map=L.map('map',{zoomControl:false,preferCanvas:true,maxZoom:19}).setView([39,35],6);
if(L.markerClusterGroup)clusterGroup=L.markerClusterGroup({maxClusterRadius:42,showCoverageOnHover:false,animate:false,removeOutsideVisibleBounds:false,iconCreateFunction:c=>L.divIcon({className:'',html:'<div class="clusterPin" data-count="'+c.getChildCount()+'">'+c.getChildCount()+'<small>yer</small></div>',iconSize:[44,44]})}).addTo(map);
layer=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:19}).addTo(map);
let tileErrors=0;layer.on('tileerror',()=>{if(++tileErrors===4)flash('Bazı harita parçaları yüklenemedi. Bağlantını kontrol et.')});
$('#zoomIn').addEventListener('click',()=>map.zoomIn());$('#zoomOut').addEventListener('click',()=>map.zoomOut());$('#areaBtn').addEventListener('click',()=>{if(map.getZoom()<12){map.setZoom(13);flash('Haritayı istediğin bölgeye taşı ve yeniden ara.');return}const p=map.getCenter();selectCenter(p.lat,p.lng,'Seçtiğin bölge')});render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
