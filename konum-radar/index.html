<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Konum Radar ile yakınındaki yerleri sade ve hızlı bir haritada keşfet.">
<title>Konum Radar</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://tile.openstreetmap.org">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --ink:#15171a;--muted:#6f747b;--line:#e6e8eb;--surface:#fff;--soft:#f5f6f7;
  --accent:#0b7a70;--blue:#2f6fed;--shadow:0 8px 24px rgba(18,22,26,.10)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#e8ecef;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{touch-action:manipulation}
#map{position:fixed;inset:0;z-index:1;background:#e8ecef}
.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.88)!important}
.leaflet-popup-content-wrapper{border-radius:13px;box-shadow:0 8px 22px rgba(20,24,28,.13)}
.leaflet-popup-content{font-family:inherit;font-size:12px;line-height:1.4;margin:10px 12px}
.leaflet-div-icon{background:transparent!important;border:0!important}

.topbar{position:fixed;z-index:500;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center}
.search{height:50px;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);display:flex;align-items:center;gap:9px;padding:0 12px}
.searchGlyph{width:20px;color:#70757b;font-size:18px;line-height:1;text-align:center}
.search input{border:0;outline:0;background:transparent;min-width:0;flex:1;font-size:14px;color:var(--ink)}
.search input::placeholder{color:#9a9ea4}
.weather{font-size:11px;color:var(--muted);font-weight:750;white-space:nowrap}
.locateTop{width:50px;height:50px;border:1px solid var(--line);border-radius:15px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);font-size:20px;display:grid;place-items:center}

.chips{position:fixed;z-index:490;top:calc(69px + env(safe-area-inset-top));left:0;right:0;padding:0 12px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:34px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 12px;color:#42474d;font-size:11px;font-weight:750;box-shadow:0 2px 9px rgba(18,22,26,.06)}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}

.notice{position:fixed;z-index:700;left:50%;top:calc(115px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-5px);max-width:calc(100% - 36px);background:#17191c;color:#fff;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:700;opacity:0;pointer-events:none;transition:.18s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice.show{opacity:1;transform:translateX(-50%) translateY(0)}

.sheet{position:fixed;z-index:600;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));height:136px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 34px rgba(18,22,26,.13);overflow:hidden;transition:height .25s ease}
.sheet.open{height:min(60dvh,590px)}
.handleArea{height:21px;display:grid;place-items:center;cursor:pointer}
.handle{width:34px;height:4px;border-radius:99px;background:#d5d8dc}
.sheetHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 13px 7px}
.titleWrap{min-width:0}
.titleWrap b{display:block;font-size:16px;line-height:20px;letter-spacing:-.15px}
.titleWrap span{display:block;font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.expand{width:34px;height:34px;border:0;border-radius:11px;background:var(--soft);color:#454a50;font-size:15px;font-weight:850}
.quick{display:flex;align-items:center;gap:7px;padding:0 13px 12px}
.quickLabel{font-size:10px;color:var(--muted)}
.quick b{font-size:11px}
.dotSep{width:3px;height:3px;border-radius:50%;background:#c6c9cd}
.results{height:calc(100% - 85px);overflow-y:auto;padding:0 10px 14px;scrollbar-width:none}
.results::-webkit-scrollbar{display:none}
.place{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #f0f1f2;background:#fff}
.place:last-child{border-bottom:0}
.catBadge{width:38px;height:38px;border-radius:12px;background:#f1f4f4;color:var(--accent);font-size:11px;font-weight:900;display:grid;place-items:center}
.placeMain{min-width:0}
.place h3{margin:0 0 3px;font-size:13px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:10px;color:var(--muted)}
.placeActions{display:flex;gap:5px}
.iconBtn{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#3c4147;font-size:14px;display:grid;place-items:center}
.iconBtn.route{background:var(--ink);border-color:var(--ink);color:#fff}
.empty{padding:26px 12px;text-align:center;color:var(--muted);font-size:12px}
.permission{padding:4px 13px 13px}
.permission p{margin:0 0 10px;color:var(--muted);font-size:11px;line-height:1.45}
.permission button{width:100%;height:42px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-size:12px;font-weight:800}

.userDot{width:17px;height:17px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 2px rgba(47,111,237,.22)}
.poi{width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid #d8dbde;box-shadow:0 3px 9px rgba(18,22,26,.18);display:grid;place-items:center}
.poi:after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.poi.selected{border-color:var(--ink);box-shadow:0 3px 11px rgba(18,22,26,.24)}
.poi.selected:after{background:var(--ink)}

@media(min-width:720px){
  .topbar,.chips{max-width:720px;margin:auto}
  .sheet{left:50%;right:auto;transform:translateX(-50%);width:min(700px,calc(100% - 16px))}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <label class="search">
    <span class="searchGlyph">⌕</span>
    <input id="searchInput" type="search" autocomplete="off" placeholder="Yakınında ne arıyorsun?">
    <span class="weather" id="weather"></span>
  </label>
  <button class="locateTop" id="locateBtn" aria-label="Konumuma dön">◎</button>
</div>

<div class="chips" id="chips">
  <button class="chip active" data-cat="nearby">Yakınımda</button>
  <button class="chip" data-cat="cafe">Kafe</button>
  <button class="chip" data-cat="restaurant">Yemek</button>
  <button class="chip" data-cat="supermarket">Market</button>
  <button class="chip" data-cat="pharmacy">Eczane</button>
  <button class="chip" data-cat="hospital">Sağlık</button>
  <button class="chip" data-cat="park">Park</button>
  <button class="chip" data-cat="hotel">Otel</button>
</div>

<div class="notice" id="notice">Hazır</div>
<div id="status" data-ready="false" hidden></div>

<section class="sheet" id="sheet">
  <div class="handleArea" id="handle"><div class="handle"></div></div>
  <div class="sheetHead">
    <div class="titleWrap">
      <b id="sheetTitle">Yakındaki yerler</b>
      <span id="sheetSub">Konumunu kullanarak yakınındaki seçenekleri gösterelim.</span>
    </div>
    <button class="expand" id="expand" aria-label="Sonuçları aç">⌃</button>
  </div>
  <div class="quick" id="quick">
    <span class="quickLabel">Henüz konum yok</span>
  </div>
  <div class="results" id="results"></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';

if(typeof L==='undefined'){
  document.getElementById('notice').textContent='Harita yüklenemedi';
  document.getElementById('notice').classList.add('show');
  return;
}

var label={cafe:'Kafe',restaurant:'Yemek',supermarket:'Market',pharmacy:'Eczane',hospital:'Sağlık',atm:'ATM',park:'Park',hotel:'Otel',other:'Yer'};
var badge={cafe:'K',restaurant:'Y',supermarket:'M',pharmacy:'E',hospital:'S',atm:'A',park:'P',hotel:'O',other:'•'};
var state={lat:null,lon:null,radius:1000,cat:'nearby',query:'',items:[],remote:[],markers:[],selected:null};
var map=L.map('map',{zoomControl:false,attributionControl:true,preferCanvas:true}).setView([39.0,35.0],6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);

var userMarker=null,noticeTimer=null,searchTimer=null,searchController=null;
var endpoints=[
  'https://overpass-api.de/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
  'https://overpass.maprva.org/api/interpreter'
];

function q(s){return document.querySelector(s)}
function qa(s){return Array.from(document.querySelectorAll(s))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function flash(msg,bad){
  var n=q('#notice');n.textContent=msg;n.style.background=bad?'#991b1b':'#17191c';n.classList.add('show');
  clearTimeout(noticeTimer);noticeTimer=setTimeout(function(){n.classList.remove('show')},2200);
}
function dist(a,b,c,d){
  var R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p;
  var A=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)*Math.sin(y/2);
  return 2*R*Math.asin(Math.sqrt(A));
}
function fmt(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km'}
function cat(t){
  if(t.amenity==='cafe')return'cafe';
  if(t.amenity==='restaurant'||t.amenity==='fast_food')return'restaurant';
  if(t.shop==='supermarket'||t.shop==='convenience')return'supermarket';
  if(t.amenity==='pharmacy')return'pharmacy';
  if(t.amenity==='hospital'||t.amenity==='clinic')return'hospital';
  if(t.amenity==='atm')return'atm';
  if(t.leisure==='park')return'park';
  if(t.tourism==='hotel'||t.tourism==='hostel')return'hotel';
  return'other';
}
function query(lat,lon,r){
  return '[out:json][timeout:14];('+
  'nwr(around:'+r+','+lat+','+lon+')[\"amenity\"~\"^(cafe|restaurant|fast_food|pharmacy|hospital|clinic|atm)$\"];'+
  'nwr(around:'+r+','+lat+','+lon+')[\"shop\"~\"^(supermarket|convenience)$\"];'+
  'nwr(around:'+r+','+lat+','+lon+')[\"leisure\"=\"park\"];'+
  'nwr(around:'+r+','+lat+','+lon+')[\"tourism\"~\"^(hotel|hostel)$\"];);out center tags;';
}
async function overpass(body){
  var last=null;
  for(var i=0;i<endpoints.length;i++){
    var controller=new AbortController(),timer=setTimeout(function(){controller.abort()},9000);
    try{
      var r=await fetch(endpoints[i],{method:'POST',body:new URLSearchParams({data:body}),signal:controller.signal});
      clearTimeout(timer);
      if(!r.ok)throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){
      clearTimeout(timer);last=e;console.warn('Overpass fallback',endpoints[i],e&&e.message?e.message:e);
    }
  }
  throw last||new Error('Veri servisi yanıt vermedi');
}
function ll(el){return el.type==='node'?[el.lat,el.lon]:[el.center&&el.center.lat,el.center&&el.center.lon]}
function defaultSet(){
  var out=[],per={};
  state.items.forEach(function(x){
    if(out.length>=6)return;
    per[x.cat]=per[x.cat]||0;
    if(per[x.cat]<1){out.push(x);per[x.cat]++}
  });
  if(out.length<6){
    state.items.forEach(function(x){
      if(out.length>=6)return;
      if(!out.some(function(y){return y.id===x.id}))out.push(x);
    });
  }
  return out;
}
function visible(){
  if(state.query){
    if(state.remote.length)return state.remote.slice(0,10);
    var n=state.query.toLocaleLowerCase('tr-TR');
    return state.items.filter(function(x){
      return x.name.toLocaleLowerCase('tr-TR').includes(n)||label[x.cat].toLocaleLowerCase('tr-TR').includes(n);
    }).slice(0,10);
  }
  if(state.cat==='nearby')return defaultSet();
  return state.items.filter(function(x){return x.cat===state.cat}).slice(0,10);
}
function poiIcon(selected){
  return L.divIcon({className:'',html:'<div class="poi'+(selected?' selected':'')+'"></div>',iconSize:[24,24],iconAnchor:[12,12]});
}
function userIcon(){
  return L.divIcon({className:'',html:'<div class="userDot"></div>',iconSize:[17,17],iconAnchor:[8,8]});
}
function clearMarkers(){state.markers.forEach(function(m){map.removeLayer(m)});state.markers=[]}
function focusPlace(x){
  state.selected=x.id;
  map.setView([x.lat,x.lon],17);
  drawMarkers();
  setSheet(false);
}
function row(x){
  var id=encodeURIComponent(x.id);
  return '<div class="place" data-id="'+id+'">'+
    '<div class="catBadge">'+badge[x.cat]+'</div>'+
    '<div class="placeMain"><h3>'+esc(x.name)+'</h3><div class="meta">'+label[x.cat]+' · '+fmt(x.dist)+'</div></div>'+
    '<div class="placeActions">'+
      '<button class="iconBtn mapBtn" data-id="'+id+'" aria-label="Haritada göster">⌖</button>'+
      '<button class="iconBtn route routeBtn" data-id="'+id+'" aria-label="Yol tarifi">↗</button>'+
    '</div>'+
  '</div>';
}
function drawMarkers(){
  clearMarkers();
  visible().forEach(function(x){
    var m=L.marker([x.lat,x.lon],{icon:poiIcon(state.selected===x.id)})
      .addTo(map)
      .bindPopup('<b>'+esc(x.name)+'</b><br>'+label[x.cat]+' · '+fmt(x.dist));
    m.on('click',function(){state.selected=x.id;drawMarkers();m.openPopup()});
    state.markers.push(m);
  });
}
function render(){
  var arr=visible();
  drawMarkers();
  q('#sheetTitle').textContent=state.query?'Arama sonuçları':(state.cat==='nearby'?'Yakındaki yerler':label[state.cat]);
  if(state.lat===null){
    q('#sheetSub').textContent='Konumunu kullanarak yakınındaki seçenekleri gösterelim.';
    q('#quick').innerHTML='<span class="quickLabel">Henüz konum yok</span>';
    q('#results').innerHTML='<div class="permission"><p>Yakınındaki yerleri sıralamak ve mesafeyi hesaplamak için konum izni gerekiyor.</p><button id="permissionBtn">Konumumu kullan</button></div>';
    return;
  }
  q('#sheetSub').textContent=state.query
    ?(arr.length+' sonuç')
    :(state.cat==='nearby'?'Sana en yakın, farklı türlerden seçilmiş yerler':arr.length+' sonuç · 1 km çevre');
  q('#quick').innerHTML=arr.length
    ?'<b>'+arr.length+' yer</b><span class="dotSep"></span><span class="quickLabel">en yakın '+fmt(arr[0].dist)+'</span>'
    :'<span class="quickLabel">Sonuç bulunamadı</span>';
  q('#results').innerHTML=arr.length?arr.map(row).join(''):'<div class="empty">Bu aramada yakınında uygun bir yer bulamadık.</div>';
}
function setSheet(open){
  q('#sheet').classList.toggle('open',open);
  q('#expand').textContent=open?'⌄':'⌃';
}
function drawUser(){
  if(userMarker)map.removeLayer(userMarker);
  userMarker=L.marker([state.lat,state.lon],{icon:userIcon(),zIndexOffset:1000}).addTo(map).bindPopup('Konumun');
  var bounds=L.latLng(state.lat,state.lon).toBounds(state.radius*2);
  map.fitBounds(bounds,{paddingTopLeft:[36,118],paddingBottomRight:[36,160]});
}
async function weather(){
  try{
    var u='https://api.open-meteo.com/v1/forecast?latitude='+state.lat+'&longitude='+state.lon+'&current=temperature_2m&timezone=auto';
    var d=await (await fetch(u)).json();
    if(d.current)q('#weather').textContent=Math.round(d.current.temperature_2m)+'°';
  }catch(e){}
}
async function load(){
  flash('Yakındaki yerler aranıyor',false);
  q('#status').dataset.ready='false';
  try{
    var d=await overpass(query(state.lat,state.lon,state.radius)),seen={},a=[];
    (d.elements||[]).forEach(function(el){
      var p=ll(el);if(!p||p[0]==null||p[1]==null)return;
      var c=cat(el.tags||{}),name=(el.tags&&(el.tags.name||el.tags.brand))||label[c],id=c+'|'+name+'|'+p[0].toFixed(5)+'|'+p[1].toFixed(5);
      if(seen[id])return;seen[id]=1;
      a.push({id:id,name:name,cat:c,lat:p[0],lon:p[1],dist:dist(state.lat,state.lon,p[0],p[1])});
    });
    state.items=a.sort(function(a,b){return a.dist-b.dist});state.remote=[];state.selected=null;
    render();q('#status').dataset.ready='true';flash('Yakındaki yerler hazır',false);
  }catch(e){console.error(e);flash('Yakındaki yerler alınamadı',true)}
}
function locate(){
  if(!navigator.geolocation){flash('Tarayıcı konumu desteklemiyor',true);return}
  flash('Konum alınıyor',false);
  navigator.geolocation.getCurrentPosition(function(p){
    state.lat=p.coords.latitude;state.lon=p.coords.longitude;drawUser();weather();load();
  },function(e){console.error(e);flash('Konum izni gerekli',true);render()},{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
}
async function searchRemote(term){
  if(state.lat===null||term.length<3){state.remote=[];render();return}
  if(searchController)searchController.abort();
  searchController=new AbortController();
  try{
    var d=.025,box=(state.lon-d)+','+(state.lat+d)+','+(state.lon+d)+','+(state.lat-d);
    var u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&bounded=1&accept-language=tr&viewbox='+encodeURIComponent(box)+'&q='+encodeURIComponent(term);
    var r=await fetch(u,{signal:searchController.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    var j=await r.json();
    state.remote=j.map(function(x){
      var la=parseFloat(x.lat),lo=parseFloat(x.lon),name=x.name||String(x.display_name||'').split(',')[0]||'Yer';
      return {id:'search|'+x.osm_type+'|'+x.osm_id,name:name,cat:'other',lat:la,lon:lo,dist:dist(state.lat,state.lon,la,lo)};
    }).sort(function(a,b){return a.dist-b.dist});
  }catch(e){if(e.name!=='AbortError')console.warn('Arama',e&&e.message?e.message:e)}
  render();
}
function findById(id){return state.items.find(function(x){return x.id===id})||state.remote.find(function(x){return x.id===id})}

q('#locateBtn').addEventListener('click',function(){
  if(state.lat===null){locate();return}
  map.setView([state.lat,state.lon],16);
});
q('#handle').addEventListener('click',function(){setSheet(!q('#sheet').classList.contains('open'))});
q('#expand').addEventListener('click',function(){setSheet(!q('#sheet').classList.contains('open'))});

qa('.chip').forEach(function(b){
  b.addEventListener('click',function(){
    qa('.chip').forEach(function(x){x.classList.remove('active')});b.classList.add('active');
    state.cat=b.dataset.cat;state.query='';state.remote=[];state.selected=null;q('#searchInput').value='';
    render();setSheet(state.cat!=='nearby');
  });
});

q('#searchInput').addEventListener('focus',function(){if(state.lat===null)flash('Önce konumunu paylaş',false)});
q('#searchInput').addEventListener('input',function(e){
  state.query=e.target.value.trim();state.remote=[];state.selected=null;
  clearTimeout(searchTimer);
  render();
  if(state.query){setSheet(true);searchTimer=setTimeout(function(){searchRemote(state.query)},700)}
});

document.addEventListener('click',function(e){
  if(e.target&&e.target.id==='permissionBtn'){locate();return}
  var m=e.target.closest('.mapBtn');
  if(m){var x=findById(decodeURIComponent(m.dataset.id));if(x)focusPlace(x);return}
  var r=e.target.closest('.routeBtn');
  if(r){
    var y=findById(decodeURIComponent(r.dataset.id));
    if(y)window.open('https://www.google.com/maps/dir/?api=1&destination='+y.lat+','+y.lon,'_blank','noopener');
  }
});

var dragStart=null;
q('#sheet').addEventListener('pointerdown',function(e){if(e.target.closest('.results'))return;dragStart=e.clientY});
q('#sheet').addEventListener('pointerup',function(e){
  if(dragStart===null)return;
  var dy=e.clientY-dragStart;dragStart=null;
  if(dy<-35)setSheet(true);else if(dy>35)setSheet(false);
});

async function boot(){
  render();
  if(navigator.permissions){
    try{
      var p=await navigator.permissions.query({name:'geolocation'});
      if(p.state==='granted'){locate();return}
    }catch(e){}
  }
}
boot();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){})}
})();
</script>
</body>
</html>
