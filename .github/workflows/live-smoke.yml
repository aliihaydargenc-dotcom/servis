name: Live Smoke Test

on:
  push:
    paths:
      - "konum-radar/**"
      - ".github/workflows/live-smoke.yml"
  workflow_dispatch:

jobs:
  live-test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for this commit to reach GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export SHA="${GITHUB_SHA}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30"
          for i in $(seq 1 36); do
            JSON=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API")
            STATUS=$(python -c 'import json,sys,os; d=json.load(sys.stdin); sha=os.environ["SHA"]; xs=[r for r in d.get("workflow_runs",[]) if r.get("name")=="pages build and deployment" and r.get("head_sha")==sha]; print(xs[0].get("status","") if xs else "")' <<<"$JSON")
            CONCLUSION=$(python -c 'import json,sys,os; d=json.load(sys.stdin); sha=os.environ["SHA"]; xs=[r for r in d.get("workflow_runs",[]) if r.get("name")=="pages build and deployment" and r.get("head_sha")==sha]; print((xs[0].get("conclusion","") or "") if xs else "")' <<<"$JSON")
            echo "Pages status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then exit 0; fi
            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "success" ]; then exit 1; fi
            sleep 5
          done
          exit 1

      - name: Check live HTTP
        run: |
          set -euxo pipefail
          URL="https://aliihaydargenc-dotcom.github.io/servis/konum-radar/"
          curl -fLsS --retry 3 --retry-delay 2 "$URL" -o /tmp/live.html
          grep -q "Konum Radar" /tmp/live.html
          grep -q 'id="map"' /tmp/live.html
          grep -q 'data-cat="nearby"' /tmp/live.html
          grep -q "nominatim.openstreetmap.org" /tmp/live.html

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Browser usage test
        run: |
          python - <<'PYTEST'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          url="https://aliihaydargenc-dotcom.github.io/servis/konum-radar/"
          o=Options()
          o.add_argument("--headless=new")
          o.add_argument("--no-sandbox")
          o.add_argument("--disable-dev-shm-usage")
          o.set_capability("goog:loggingPrefs",{"browser":"ALL"})
          d=webdriver.Chrome(options=o)
          wait=WebDriverWait(d,60)
          report=[]
          def shot(name): d.save_screenshot('/tmp/konum-radar-'+name+'.png')
          def visible_control(selector):
              return d.execute_script("const e=document.querySelector(arguments[0]),r=e.getBoundingClientRect();return r.width>=40&&r.height>=40&&r.top>=0&&r.bottom<=innerHeight&&r.right<=innerWidth",selector)
          try:
              d.execute_cdp_cmd("Emulation.setDeviceMetricsOverride",{"width":390,"height":844,"deviceScaleFactor":1,"mobile":True})
              d.get(url)
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'[data-action="locate"]')))
              wait.until(lambda x:x.execute_script("return [...document.querySelectorAll('.leaflet-tile')].some(i=>i.complete&&i.naturalWidth>0)"))
              assert visible_control('[data-action="locate"]'), 'Location CTA clipped'
              assert d.execute_script('return document.documentElement.scrollWidth<=innerWidth'), 'Mobile overflow'
              shot('mobile-initial')
              report.append('390x844: initial layout, visible location CTA, map tiles PASS')
              d.find_element(By.ID,'searchInput').send_keys('Antalya')
              d.find_element(By.CSS_SELECTOR,'button[type="submit"]').click()
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'[data-area]')))
              shot('mobile-search')
              d.find_element(By.CSS_SELECTOR,'[data-area]').click()
              wait.until(lambda x:x.find_element(By.ID,'status').get_attribute('data-ready')=='true')
              assert len(d.find_elements(By.CSS_SELECTOR,'.place'))>0
              assert len(d.find_elements(By.CSS_SELECTOR,'.place'))==len(d.find_elements(By.CSS_SELECTOR,'.poi'))
              shot('mobile-results')
              d.find_element(By.ID,'expand').click()
              assert d.find_element(By.ID,'expand').get_attribute('aria-expanded')=='true'
              shot('mobile-expanded')
              d.find_element(By.CSS_SELECTOR,'[data-cat="cafe"]').click()
              assert d.find_element(By.ID,'sheetTitle').text=='Kafe'
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'.place')))
              route=d.find_element(By.CSS_SELECTOR,'.routeBtn').get_attribute('href')
              assert 'https://www.google.com/maps/dir/?api=1&destination=' in route
              d.find_element(By.CSS_SELECTOR,'[data-focus]').click()
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'.leaflet-popup')))
              shot('mobile-place')
              report.append('Live city search, selected area, nearby data, category, marker popup, route URL PASS')
              d.find_element(By.ID,'clearBtn').is_displayed()
              d.execute_cdp_cmd("Emulation.setDeviceMetricsOverride",{"width":1440,"height":960,"deviceScaleFactor":1,"mobile":False})
              d.refresh()
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'[data-action="locate"]')))
              shot('desktop-initial')
              assert d.execute_script("return document.querySelector('.sidebar').getBoundingClientRect().width===400")
              d.execute_cdp_cmd('Browser.grantPermissions',{'origin':'https://aliihaydargenc-dotcom.github.io','permissions':['geolocation']})
              d.execute_cdp_cmd('Emulation.setGeolocationOverride',{'latitude':36.89,'longitude':30.70,'accuracy':25})
              d.find_element(By.CSS_SELECTOR,'[data-action="locate"]').click()
              wait.until(lambda x:x.find_element(By.ID,'status').get_attribute('data-ready')=='true')
              shot('desktop-results')
              assert len(d.find_elements(By.CSS_SELECTOR,'.userDot'))==1
              report.append('Desktop layout and simulated GPS location PASS')
              errors=[x for x in d.get_log('browser') if x.get('level')=='SEVERE' and ('Uncaught' in x.get('message',''))]
              assert not errors,errors
              print(json.dumps(report,ensure_ascii=False,indent=2))
          finally:
              shot('last-state')
              d.quit()
          PYTEST

      - name: Upload visual test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: konum-radar-visual-test
          path: /tmp/konum-radar-*.png
          if-no-files-found: error
